<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SZEKXO</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* ── Fond vidéo ── */
        .video-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.22;
        }
        .video-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 60%, rgba(10,10,20,0.5) 0%, rgba(10,10,20,0.92) 100%);
        }

        /* ── Contenu ── */
        .page-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 560px;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 28px rgba(160,120,255,0.45));
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(160,120,255,0.12);
            border: 1px solid rgba(160,120,255,0.35);
            border-radius: 99px;
            padding: 5px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #c4a9ff;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: #a87fff;
            border-radius: 50%;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.8); }
        }

        .headline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .headline span {
            background: linear-gradient(135deg, #a87fff, #e040fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtext {
            font-size: 1rem;
            color: rgba(255,255,255,0.52);
            line-height: 1.6;
            max-width: 400px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #a87fff, #e040fb);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 15px 36px;
            border-radius: 14px;
            box-shadow: 0 6px 32px rgba(168,127,255,0.45);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
        }
        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(168,127,255,0.6);
            filter: brightness(1.1);
        }
        .cta-btn:active {
            transform: translateY(1px);
            box-shadow: 0 3px 16px rgba(168,127,255,0.35);
        }

        .cta-btn svg {
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .cta-btn:hover svg { transform: translateX(3px); }

        .note {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.28);
        }
        .note a {
            color: rgba(255,255,255,0.45);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="video-bg">
        <video autoplay muted loop playsinline disablepictureinpicture preload="auto">
            <source src="https://pub-3f730a40676642078769da769364af7a.r2.dev/START_SZEKXO_MONTAGE_web.mp4" type="video/mp4">
        </video>
    </div>

    <div class="page-content">

        <img src="/images/LOGO_SZEKXO.png" alt="SZEKXO" class="logo">

        <div class="badge">
            <span class="badge-dot"></span>
            Nouveau site disponible
        </div>

        <h1 class="headline">
            On a déménagé<br>sur <span>szekxo.com</span>
        </h1>

        <p class="subtext">
            Le nouveau site SZEKXO est maintenant en ligne.<br>
            Retrouve tout le contenu, les jeux et les offres sur la nouvelle adresse.
        </p>

        <a href="https://szekxo.com" class="cta-btn">
            Accéder au nouveau site
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>

        <p class="note">
            Les jeux (Blackjack, Dashboard…) restent disponibles sur <a href="/games">cette adresse</a> pour le moment.
        </p>

    </div>

</body>
</html>
